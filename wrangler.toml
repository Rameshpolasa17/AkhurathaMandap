# Cloudflare Pages project settings.
#
# With this file present, `npx wrangler pages deploy` needs no arguments —
# it knows the project name and where the built site lands.
#
# Change `name` if you want a different *.pages.dev subdomain.

name = "akhuratha-mandap"
pages_build_output_dir = "dist/AkhurathaMandapUI/browser"
compatibility_date = "2026-09-12"
