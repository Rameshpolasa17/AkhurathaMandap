<section class="rjf" aria-labelledby="rjf-title">
  <div class="rjf__glow" aria-hidden="true"></div>
  <div class="akm-orb rjf__orb" aria-hidden="true"></div>

  <div class="akm-container rjf__inner">
    <!-- The photograph -->
    <div class="rjf__stage" akmReveal="scale">
      <span class="rjf__halo" aria-hidden="true"></span>
      <button
        type="button"
        class="rjf__frame"
        (click)="open.set(true)"
        [attr.aria-label]="'View ' + photo.caption + ' full size'"
      >
        <app-safe-image
          [src]="photo.src"
          [alt]="photo.alt"
          [width]="photo.width"
          [height]="photo.height"
          position="center 30%"
          icon="fa-solid fa-om"
        />
        <span class="rjf__zoom" aria-hidden="true"><i class="fa-solid fa-expand"></i></span>
      </button>
    </div>

    <!-- The words -->
    <div class="rjf__copy" akmReveal="right" [revealDelay]="100">
      <span class="akm-eyebrow rjf__eyebrow">
        <i class="fa-solid fa-om" aria-hidden="true"></i>
        {{ festivalName }}
      </span>

      <h2 id="rjf-title">{{ rajaTitle }}</h2>

      <div class="rjf__rule" aria-hidden="true">
        <span></span>
        <i class="fa-solid fa-diamond"></i>
        <span></span>
      </div>

      <p class="rjf__lede">
        This year's Bappa at {{ mandapName }} — many-armed, seated on the tiger and
        dressed for darshan.
      </p>

      <p class="rjf__morya">Ganpati Bappa Morya 🙏</p>

      <div class="rjf__cta">
        <a class="akm-btn akm-btn--brand" href="#ganesh-2026">
          <i class="fa-solid fa-images" aria-hidden="true"></i>
          See this year's photos
        </a>
        <a class="akm-btn akm-btn--ghost" routerLink="/devotee-wall">
          <i class="fa-solid fa-camera" aria-hidden="true"></i>
          Devotee Photo Wall
        </a>
      </div>
    </div>
  </div>
</section>

@if (open()) {
  <app-photo-lightbox
    [photos]="photos"
    [startIndex]="0"
    [title]="rajaTitle"
    (closed)="open.set(false)"
  />
}
