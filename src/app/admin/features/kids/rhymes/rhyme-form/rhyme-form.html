<section class="rhyme-form-page">
  <div class="page-header">
    <div class="title-area">
      <div class="breadcrumb">
        <span>Kids Zone</span>
        <i class="fa-solid fa-chevron-right"></i>
        <span>Rhymes</span>
        <i class="fa-solid fa-chevron-right"></i>
        <strong>{{ isEditMode ? 'Edit Rhyme' : 'Add Rhyme' }}</strong>
      </div>

      <div class="title-row">
        <div class="title-icon">
          <i class="fa-solid fa-microphone-lines"></i>
        </div>

        <div>
          <h1>{{ isEditMode ? 'Edit Rhyme' : 'Add Rhyme' }}</h1>
          <p>Manage devotional rhymes for kids.</p>
        </div>
      </div>
    </div>
  </div>

  <form [formGroup]="form" (ngSubmit)="saveRhyme()">
    <div class="form-card">
      <div class="form-grid">
        <div class="form-group full">
          <label>Rhyme Title <span>*</span></label>
          <input type="text" formControlName="title" />
        </div>

        <div class="form-group full">
          <label>Short Description</label>
          <textarea rows="2" formControlName="shortDescription"></textarea>
        </div>

        <div class="form-group full">
          <label>Lyrics <span>*</span></label>
          <textarea rows="8" formControlName="description"></textarea>
        </div>

        <div class="form-group">
          <label>Thumbnail URL</label>
          <input type="text" formControlName="thumbnailPath" />
        </div>

        <div class="form-group">
          <label>Audio URL</label>
          <input type="text" formControlName="mediaPath" />
        </div>

        <div class="form-group full">
          <label>Video URL</label>
          <input type="text" formControlName="videoUrl" />
        </div>

        <div class="form-group">
          <label>Age Group</label>
          <select formControlName="ageGroup">
            <option value="All">All</option>
            <option value="3-5 Years">3-5 Years</option>
            <option value="6-8 Years">6-8 Years</option>
            <option value="9-12 Years">9-12 Years</option>
          </select>
        </div>

        <div class="form-group">
          <label>Duration</label>
          <input type="text" formControlName="duration" placeholder="02:30" />
        </div>

        <div class="form-group">
          <label>Display Order</label>
          <input type="number" formControlName="displayOrder" />
        </div>

        <div class="form-group checkbox">
          <label>
            <input type="checkbox" formControlName="isFeatured" />
            Featured
          </label>
        </div>

        <div class="form-group checkbox">
          <label>
            <input type="checkbox" formControlName="isActive" />
            Active
          </label>
        </div>
      </div>

      <div class="button-row">
        <button type="button" class="cancel-btn" (click)="cancel()">
          <i class="fa-solid fa-arrow-left"></i>
          Cancel
        </button>

        <button type="submit" class="save-btn" [disabled]="saving">
          <i class="fa-solid fa-floppy-disk"></i>
          {{ saving ? 'Saving...' : isEditMode ? 'Update Rhyme' : 'Save Rhyme' }}
        </button>
      </div>
    </div>
  </form>
</section>
