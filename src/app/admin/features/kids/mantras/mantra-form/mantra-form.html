<section class="story-form-page">
  <div class="page-header">
    <div class="title-area">
      <div class="breadcrumb">
        <span>Kids Zone</span>
        <i class="fa-solid fa-chevron-right"></i>
        <span>Mantras</span>
        <i class="fa-solid fa-chevron-right"></i>
        <strong>{{ isEditMode ? 'Edit Mantra' : 'Add Mantra' }}</strong>
      </div>

      <div class="title-row">
        <div class="title-icon">
          <i class="fa-solid fa-om"></i>
        </div>

        <div>
          <h1>{{ isEditMode ? 'Edit Mantra' : 'Add Mantra' }}</h1>
          <p>Manage Ganesh mantras and meanings.</p>
        </div>
      </div>
    </div>
  </div>

  <form [formGroup]="form" (ngSubmit)="saveMantra()">
    <div class="form-card">
      <div class="form-grid">
        <div class="form-group full">
          <label>Title *</label>
          <input type="text" formControlName="title" />
        </div>

        <div class="form-group full">
          <label>Short Description</label>
          <textarea rows="2" formControlName="shortDescription"></textarea>
        </div>

        <div class="form-group full">
          <label>Meaning / Description *</label>
          <textarea rows="8" formControlName="description"></textarea>
        </div>

        <div class="form-group">
          <label>Thumbnail URL</label>
          <input type="text" formControlName="thumbnailPath" />
        </div>

        <div class="form-group">
          <label>Audio URL</label>
          <input type="text" formControlName="mediaPath" />
        </div>

        <div class="form-group full">
          <label>Video URL</label>
          <input type="text" formControlName="videoUrl" />
        </div>

        <div class="form-group">
          <label>Age Group</label>
          <select formControlName="ageGroup">
            <option value="All">All</option>
            <option value="3-5 Years">3-5 Years</option>
            <option value="6-8 Years">6-8 Years</option>
            <option value="9-12 Years">9-12 Years</option>
          </select>
        </div>

        <div class="form-group">
          <label>Duration</label>
          <input type="text" formControlName="duration" />
        </div>

        <div class="form-group">
          <label>Display Order</label>
          <input type="number" formControlName="displayOrder" />
        </div>

        <div class="form-group checkbox">
          <label>
            <input type="checkbox" formControlName="isFeatured" />
            Featured
          </label>
        </div>

        <div class="form-group checkbox">
          <label>
            <input type="checkbox" formControlName="isActive" />
            Active
          </label>
        </div>
      </div>

      <div class="button-row">
        <button type="button" class="cancel-btn" (click)="cancel()">Cancel</button>

        <button type="submit" class="save-btn" [disabled]="saving">
          <i class="fa-solid fa-floppy-disk"></i>
          {{ saving ? 'Saving...' : 'Save Mantra' }}
        </button>
      </div>
    </div>
  </form>
</section>
