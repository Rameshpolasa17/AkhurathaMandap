<div class="page-header">
  <div>
    <h2>Events</h2>

    <p>Manage Festival Events</p>
  </div>

  <button class="add-btn" (click)="openForm()">
    <i class="fa-solid fa-plus"></i>

    Add Event
  </button>
</div>

<div class="event-grid">
  @for (item of events; track item.eventId) {
    <div class="event-card">
      <div class="card-top">
        <div class="icon">
          <i class="fa-solid fa-calendar-days"></i>
        </div>

        <div class="status" [class.active]="item.isActive" [class.inactive]="!item.isActive">
          {{ item.isActive ? 'Active' : 'Inactive' }}
        </div>
      </div>

      <h3>{{ item.title }}</h3>

      <p>{{ item.description }}</p>

      <div class="location">
        <i class="fa-solid fa-location-dot"></i>

        {{ item.location }}
      </div>

      <div class="date">
        <i class="fa-regular fa-calendar"></i>

        {{ item.startDate | date: 'dd MMM yyyy' }}
      </div>

      <div class="footer">
        <button class="edit-btn" (click)="edit(item)">Edit</button>

        <button class="delete-btn" (click)="delete(item)">
          <i class="fa-solid fa-trash"></i>
          Delete
        </button>
      </div>
    </div>
  } @empty {
    <div class="empty-state">
      <i class="fa-solid fa-calendar-xmark"></i>

      <h3>No Events</h3>
    </div>
  }
</div>

@if (showForm) {
  <div class="popup-overlay">
    <app-event-form [event]="selectedEvent" (close)="closeForm()"> </app-event-form>
  </div>
}
