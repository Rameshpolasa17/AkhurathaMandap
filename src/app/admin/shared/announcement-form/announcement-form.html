<div class="popup">
  <div class="popup-header">
    <h2>
      {{ request.announcementId == 0 ? 'Add Announcement' : 'Edit Announcement' }}
    </h2>

    <button type="button" (click)="cancel()">✕</button>
  </div>

  <div class="popup-body">
    <label>Title <span class="required">*</span></label>

    <input type="text" placeholder="Enter announcement title" [(ngModel)]="request.title" />

    <label>Description</label>

    <textarea rows="5" placeholder="Enter description" [(ngModel)]="request.description">
    </textarea>

    <div class="date-row">
      <div class="form-group">
        <label>Publish Date</label>

        <input type="date" [(ngModel)]="request.publishDate" />
      </div>

      <div class="form-group">
        <label>Expiry Date</label>

        <input type="date" [(ngModel)]="request.expiryDate" />
      </div>
    </div>

    <div class="checkbox-row">
      <input id="active" type="checkbox" [(ngModel)]="request.isActive" />

      <label for="active"> Active </label>
    </div>
  </div>

  <div class="popup-footer">
    <button class="cancel-btn" type="button" [disabled]="loading" (click)="cancel()">Cancel</button>

    <button class="save-btn" type="button" [disabled]="loading" (click)="save()">
      @if (loading) {
        Saving...
      } @else {
        <span>
          <i class="fa-solid fa-floppy-disk"></i>
          Save
        </span>
      }
    </button>
  </div>
</div>
