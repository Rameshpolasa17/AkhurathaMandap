<div class="popup-backdrop">
  <div class="popup">
    <h3>
      {{ model.galleryId === 0 ? 'Add Gallery' : 'Edit Gallery' }}
    </h3>

    <div class="form-group">
      <label>Title</label>

      <input class="form-control" [(ngModel)]="model.title" />
    </div>

    <div class="form-group">
      <label>Description</label>

      <textarea rows="4" class="form-control" [(ngModel)]="model.description"> </textarea>
    </div>

    <div class="form-group">
      <label>Gallery Image</label>

      <label class="upload-box">
        <input type="file" accept="image/*" (change)="onFileSelected($event)" hidden />

        @if (!imagePreview) {
          <div class="upload-placeholder">
            <i class="fa-solid fa-cloud-arrow-up"></i>

            <h5>Click to Upload</h5>

            <p>JPG, PNG, JPEG</p>
          </div>
        }

        @if (imagePreview) {
          <img [src]="imagePreview" class="preview-image" />
        }
      </label>
    </div>
    <hr />

    <hr />

    <div class="form-group">
      <label>Bulk Upload Images</label>

      <div
        class="drop-zone"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave($event)"
        (drop)="onDrop($event)"
        [class.dragging]="isDragging"
      >
        <i class="fa-solid fa-cloud-arrow-up"></i>

        <h4>Drag & Drop Images Here</h4>

        <p>or</p>

        <input
          #bulkInput
          hidden
          type="file"
          multiple
          accept="image/*"
          (change)="onMultipleFilesSelected($event)"
        />

        <button type="button" class="btn btn-outline-primary" (click)="bulkInput.click()">
          Browse Images
        </button>
      </div>
    </div>

    @if (bulkPreviews.length) {
      <div class="bulk-preview">
        @for (image of bulkPreviews; track $index) {
          <div class="preview-card">
            <img [src]="image" class="bulk-image" />

            <button class="remove-btn" type="button" (click)="removeImage($index)">✕</button>
          </div>
        }
      </div>
    }
    <div class="form-group">
      <label>Category</label>

      <input class="form-control" [(ngModel)]="model.category" />
    </div>

    <div class="form-group">
      <label>Display Order</label>

      <input type="number" class="form-control" [(ngModel)]="model.displayOrder" />
    </div>

    <div class="form-check">
      <input class="form-check-input" type="checkbox" [(ngModel)]="model.isActive" />

      <label class="form-check-label"> Active </label>
    </div>

    <div class="buttons">
      <button class="btn btn-success" (click)="save()">Save</button>

      <button class="btn btn-primary" (click)="uploadAll()">Upload All</button>

      <button class="btn btn-secondary" (click)="cancel()">Cancel</button>
    </div>
  </div>
</div>
