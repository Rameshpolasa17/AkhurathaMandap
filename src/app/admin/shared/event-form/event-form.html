<div class="popup">
  <div class="popup-header">
    <h2>
      {{ request.eventId === 0 ? 'Add Event' : 'Edit Event' }}
    </h2>

    <button (click)="cancel()">✕</button>
  </div>

  <div class="popup-body">
    <label>Event Title</label>

    <input type="text" [(ngModel)]="request.title" />

    <label>Description</label>

    <textarea rows="4" [(ngModel)]="request.description"> </textarea>

    <label>Location</label>

    <input type="text" [(ngModel)]="request.location" />

    <label>Image URL</label>

    <input type="text" [(ngModel)]="request.imageUrl" />

    <div class="date-row">
      <div class="form-group">
        <label>Start Date</label>

        <input type="date" [(ngModel)]="request.startDate" />
      </div>

      <div class="form-group">
        <label>End Date</label>

        <input type="date" [(ngModel)]="request.endDate" />
      </div>
    </div>

    <div class="checkbox-row">
      <input type="checkbox" [(ngModel)]="request.isActive" id="active" />

      <label for="active"> Active </label>
    </div>
  </div>

  <div class="popup-footer">
    <button class="cancel-btn" (click)="cancel()">Cancel</button>

    <button class="save-btn" (click)="save()" [disabled]="loading">
      {{ loading ? 'Saving...' : 'Save' }}
    </button>
  </div>
</div>
