<!-- 10. The people behind the festival -->
<section class="hm-people akm-section akm-section--tint" aria-labelledby="hm-people-title">
  <div class="akm-container">
    <div class="akm-section-head akm-section-head--center" akmReveal>
      <span class="akm-eyebrow">
        <i class="fa-solid fa-people-group" aria-hidden="true"></i>
        The people
      </span>
      <h2 id="hm-people-title">Behind the Festival</h2>
      <p>A volunteer committee and six seva teams — nobody here is paid.</p>
      <div class="akm-rule"></div>
    </div>

    <div class="hm-people__block">
      <div class="hm-people__bar" akmReveal>
        <h3>Committee</h3>
        <a class="akm-link" routerLink="/committee">
          Full committee
          <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
        </a>
      </div>
      <app-people-grid
        [people]="committee"
        icon="fa-solid fa-people-group"
        emptyText="This year's committee is being confirmed."
      />
    </div>

    <div class="hm-people__block">
      <div class="hm-people__bar" akmReveal>
        <h3>Seva Teams</h3>
        <a class="akm-link" routerLink="/volunteers">
          All volunteers
          <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
        </a>
      </div>
      <app-people-grid
        [people]="volunteers"
        icon="fa-solid fa-hands-holding-circle"
        emptyText="This year's seva teams are being formed."
      />
    </div>
  </div>
</section>
